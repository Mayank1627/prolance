{% extends 'base.html' %}

{% block title %}404 - Page Not Found | Prolance{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-20 text-center">
    <div class="card-neo bg-white p-10 sm:p-14">
        <div class="inline-flex items-center justify-center w-24 h-24 rounded-3xl bg-neo-yellow border-3 border-neo-black shadow-neo mb-6">
            <span class="text-4xl font-black">404</span>
        </div>
        <h1 class="text-3xl sm:text-4xl font-black text-neo-black mb-3">Project or Page Missing</h1>
        <p class="text-base font-medium text-zinc-600 mb-8 max-w-md mx-auto">
            The page you requested may have been archived, renamed, or relocated within our marketplace records.
        </p>
        <div class="flex flex-wrap items-center justify-center gap-4">
            <a href="{% url 'core:landing' %}" class="btn-neo-yellow">
                <i data-lucide="home" class="w-4 h-4 mr-2"></i> Return Home
            </a>
            <a href="{% url 'projects:browse' %}" class="btn-neo-white">
                <i data-lucide="search" class="w-4 h-4 mr-2"></i> Browse Projects
            </a>
        </div>
    </div>
</div>
{% endblock %}
